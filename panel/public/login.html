<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CWELOWNIA — logowanie</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#111; color:#eee; display:flex;
           min-height:100vh; align-items:center; justify-content:center; margin:0; }
    form { background:#1c1c1c; padding:32px; border-radius:12px; width:300px; box-shadow:0 0 20px #0008; }
    h1 { margin:0 0 20px; font-size:22px; color:#40ff40; text-align:center; }
    input { width:100%; padding:10px; margin:6px 0 14px; border-radius:6px; border:1px solid #333;
            background:#111; color:#eee; box-sizing:border-box; }
    button { width:100%; padding:11px; border:0; border-radius:6px; background:#40ff40; color:#111;
             font-weight:bold; cursor:pointer; }
    .err { color:#ff5555; font-size:13px; text-align:center; margin-bottom:8px; }
  </style>
</head>
<body>
  <form method="post" action="/login">
    <h1>CWELOWNIA</h1>
    <div class="err" id="err"></div>
    <label>Użytkownik</label>
    <input name="user" autofocus>
    <label>Hasło</label>
    <input name="password" type="password">
    <button type="submit">Zaloguj</button>
  </form>
  <script>
    if (new URLSearchParams(location.search).get('error'))
      document.getElementById('err').textContent = 'Błędny login lub hasło.';
  </script>
</body>
</html>
